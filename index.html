<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK Cyber Compliance Assistant</title>
<meta name="description" content="Generate the cybersecurity control requirements that apply to your firm under SFC, HKMA, PCPD and the Critical Infrastructure Ordinance — every control cited to its official source.">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <img class="brand-mark" src="assets/icon.svg" alt="" width="26" height="26">
    <h1 id="app-title">HK Cyber Compliance Assistant</h1>
    <span class="sub" id="version"></span>
  </div>
  <div class="header-actions">
    <!-- 语言按钮由 app.js 依 HKCC.locales 生成 -->
    <div class="lang" id="lang" role="group"></div>
    <button id="export-project" class="primary"></button>
    <button id="import-project"></button>
    <input id="import-file" type="file" accept=".json,.hkcc.json,application/json" hidden>
    <button id="export-csv"></button>
    <button id="print"></button>
    <button id="reset"></button>
    <button id="theme"></button>
  </div>
</header>

<div class="layout">
  <aside class="panel sidebar" id="sidebar"></aside>

  <main>
    <div class="print-header">
      <h1 id="ph-title"></h1>
      <p id="ph-project"></p>
      <p id="ph-scope"></p>
      <p id="ph-attrs"></p>
      <p id="ph-date"></p>
    </div>

    <div class="panel summary" id="summary"></div>

    <div class="panel toolbar">
      <input type="search" id="q">
      <select id="domain-filter"></select>
      <label class="inline"><input type="checkbox" id="merge"> <span id="merge-label"></span></label>
      <label class="inline"><input type="checkbox" id="gaps"> <span id="gaps-label"></span></label>
    </div>

    <div id="results"></div>
  </main>
</div>

<footer class="disclaimer" id="disclaimer"></footer>

<script src="data/_registry.js"></script>
<script src="data/sources.js"></script>
<script src="data/taxonomy.js"></script>
<script src="data/controls/sfc-internet-trading.js"></script>
<script src="data/controls/sfc-circulars-2026.js"></script>
<script src="data/controls/sfc-vatp.js"></script>
<script src="data/controls/hkma.js"></script>
<script src="data/controls/svf.js"></script>
<script src="data/controls/pdpo.js"></script>
<script src="data/controls/critical-infrastructure.js"></script>
<script src="data/i18n/zh-Hans.js"></script>
<script src="data/i18n/zh-Hant.js"></script>
<script src="data/i18n/en.js"></script>
<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
