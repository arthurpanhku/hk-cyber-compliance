<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 374 84" width="374" height="84"
     role="img" aria-label="香港网络安全合规助手">
  <defs>
    <linearGradient id="hkcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- 标志：盾牌（网络安全）＋ 条文（散落的监管条款）＋ 勾（已核对的控制点） -->
  <g transform="translate(2 10)">
    <path d="M32 4.5 L54.8 12.1 Q56.5 12.7 56.5 14.4 V33 C56.5 46.4 46.6 55.9 32.6 59.4
             Q32 59.6 31.4 59.4 C17.4 55.9 7.5 46.4 7.5 33 V14.4 Q7.5 12.7 9.2 12.1 Z"
          fill="url(#hkcc)"/>
    <g fill="#fff" opacity=".55">
      <rect x="19.5" y="16" width="25" height="4.6" rx="2.3"/>
      <rect x="19.5" y="24.2" width="15.5" height="4.6" rx="2.3"/>
    </g>
    <path d="M20.8 40.8 L28.4 48.4 L44 32.8" fill="none" stroke="#fff" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- textLength 锁定字宽，使不同系统字体下锁形宽度一致 -->
  <text x="78" y="43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="650"
        fill="#e6e9ee" textLength="290" lengthAdjust="spacing">香港网络安全合规助手</text>
  <text x="79" y="65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5"
        fill="#9aa4b2" textLength="252" lengthAdjust="spacing">SFC · HKMA · PCPD · 关键基础设施条例</text>
</svg>
